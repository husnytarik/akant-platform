<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neademy - Öğrencilerim</title>
  <link rel="stylesheet" href="/style.css?v=13">
  <script src="/renk.js?v=10"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1>Öğrencilerim</h1>
  </header>
  <main class="kart panel genis">
    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>
    <div class="sekmeler gizli" id="siniflar"></div>
    <section class="ders-panel" id="liste-kap"><div id="liste"></div></section>
    <section id="profil" class="ders-panel gizli">
      <div class="ders-panel-ust">
        <div class="p-kimlik">
          <span id="p-foto"></span>
          <div>
            <h2 id="p-baslik"></h2>
            <p id="p-alt" class="alt"></p>
          </div>
        </div>
        <div class="p-eylem"><a id="p-dosya" class="ikincil" href="#">Tüm dosya</a><button type="button" id="p-kapat" class="ikincil">Kapat</button></div>
      </div>
      <div class="sekmeler" id="sekmeler">
        <button type="button" data-sekme="genel" aria-pressed="true">Özet</button>
        <button type="button" data-sekme="devam" aria-pressed="false">Devam</button>
        <button type="button" data-sekme="sinav" aria-pressed="false">Sınav</button>
        <button type="button" data-sekme="gelisim" aria-pressed="false">Gelişim</button>
        <button type="button" data-sekme="odev" aria-pressed="false">Ödev</button>
      </div>
      <div id="icerik"></div>
    </section>
  </main>
  <script src="/grafik.js?v=10"></script>
  <script src="/avatar.js?v=10"></script>
  <script src="/sinav-sira.js?v=10"></script>
  <script src="/ogrenci-ortak.js?v=10"></script>
  <script src="/ogrencilerim.js?v=10"></script>
  <script src="/bant.js?v=10"></script>
</body>
</html>
