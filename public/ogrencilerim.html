<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akant Koleji - Öğrencilerim</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/renk.js"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1>Öğrencilerim</h1>
  </header>
  <main class="kart panel genis">
    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>
    <div class="sekmeler gizli" id="siniflar"></div>
    <div id="liste"></div>
    <section id="profil" class="ders-panel gizli">
      <div class="ders-panel-ust">
        <div>
          <h2 id="p-baslik"></h2>
          <p id="p-alt" class="alt"></p>
        </div>
        <button type="button" id="p-kapat" class="ikincil">Kapat</button>
      </div>
      <div class="sekmeler" id="sekmeler">
        <button type="button" data-sekme="genel" aria-pressed="true">Genel</button>
        <button type="button" data-sekme="devam" aria-pressed="false">Devamsızlık</button>
        <button type="button" data-sekme="sinav" aria-pressed="false">Sınavlar</button>
      </div>
      <div id="icerik"></div>
    </section>
  </main>
  <script src="/grafik.js"></script>
  <script src="/ogrencilerim.js"></script>
  <script src="/bant.js"></script>
</body>
</html>
