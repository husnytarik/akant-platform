<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akant Koleji - Ders Programı</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/renk.js"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1>Haftalık ders programı</h1>
  </header>
  <main class="kart panel genis prg-sayfa">

    <div class="sekmeler" role="group" aria-label="Bölümler">
      <button type="button" data-sekme="program" aria-pressed="true">Sınıf programı</button>
      <button type="button" data-sekme="ogretmen" aria-pressed="false">Öğretmen programı</button>
    </div>

    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>

    <section id="s-program">
      <label for="program-sinif">Sınıf</label>
      <select id="program-sinif"></select>

      <div class="prg-arac">
        <button type="button" id="oto" class="birincil">Otomatik doldur</button>
        <button type="button" id="temizle" class="ikincil">Temizle</button>
      </div>

      <p class="prg-ipucu">Aşağıdan bir ders seçin, sonra programda dersi koymak istediğiniz saate dokunun. Dolu hücreye aynı dersle dokunmak onu kaldırır.</p>
      <div id="fircalar" class="prg-fircalar" role="group" aria-label="Dersler"></div>
      <div id="program-grid" class="prg-grid"></div>
      <p class="prg-not"><span class="prg-nokta mesgul"></span> Öğretmen o saatte başka sınıfta</p>
    </section>

    <section id="s-ogretmen" class="gizli">
      <label for="ogretmen-sec">Öğretmen</label>
      <select id="ogretmen-sec"></select>
      <div id="ogretmen-grid" class="prg-grid"></div>
    </section>
  </main>
  <script src="/ders-programi.js"></script>
  <script src="/bant.js"></script>
</body>
</html>
