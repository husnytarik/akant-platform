<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neademy - Ders programı</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/renk.js"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1>Ders programı</h1>
  </header>
  <main class="kart panel genis">
    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>
    <div class="form-satir gizli" id="cocuk-kutu">
      <label for="cocuk">Öğrenci</label>
      <select id="cocuk"></select>
    </div>

    <div class="sekmeler" id="gorunum">
      <button type="button" data-gorunum="gun" aria-pressed="true">Günlük</button>
      <button type="button" data-gorunum="hafta" aria-pressed="false">Haftalık</button>
    </div>

    <div class="gun-seridi" id="gun-seridi">
      <button type="button" id="geri" aria-label="Önceki">&larr;</button>
      <div class="gun-baslik">
        <strong id="gun-adi"></strong>
        <button type="button" id="bugun" class="ikincil">Bugün</button>
      </div>
      <button type="button" id="ileri" aria-label="Sonraki">&rarr;</button>
    </div>

    <div id="zaman"></div>
    <div id="hafta" class="gizli"></div>
    <div id="detay" class="hafta-detay gizli"></div>
    <div id="lejant" class="lejant"></div>
  </main>
  <script src="/ders-stil.js"></script>
  <script src="/program.js"></script>
  <script src="/bant.js"></script>
</body>
</html>
