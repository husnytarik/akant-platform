<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neademy - Etüt</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/renk.js"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1 id="baslik">Etüt</h1>
  </header>
  <main class="kart panel genis">

    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>

    <div class="sekmeler gizli" id="e-sekmeler">
      <button type="button" data-sekme="liste" aria-pressed="true">Açtığım etütler</button>
      <button type="button" data-sekme="yeni" aria-pressed="false">Yeni etüt</button>
    </div>

    <section id="yeni" class="bolum-kutu gizli">
      <h2 class="baslik2">Yeni etüt</h2>
      <form id="etut-form">
        <div class="form-satir">
          <div>
            <label for="konu">Konu</label>
            <input id="konu" maxlength="80" required placeholder="Örn. Kesirler tekrarı">
          </div>
          <div>
            <label for="ders">Ders (isteğe bağlı)</label>
            <select id="ders"></select>
          </div>
          <div>
            <label for="yer">Yer (isteğe bağlı)</label>
            <input id="yer" maxlength="60" placeholder="Örn. 5-A sınıfı">
          </div>
        </div>
        <div class="form-satir">
          <div>
            <label for="tarih">Tarih</label>
            <input id="tarih" type="date" required>
          </div>
          <div>
            <label for="saat">Başlangıç saati</label>
            <input id="saat" type="time" required>
          </div>
          <div>
            <label for="sure">Süre</label>
            <select id="sure"></select>
          </div>
        </div>
        <label for="not">Veliye not (isteğe bağlı)</label>
        <input id="not" maxlength="300">

        <fieldset class="kutu">
          <legend>Öğrenciler</legend>
          <p class="alt">Sınıfa dokunun, öğrencileri aşağıda listelenir. Katılmayacak öğrenciye dokunarak listeden çıkarın.</p>
          <div id="sinif-chips"></div>
          <div id="secilen-liste"></div>
        </fieldset>

        <div id="cakisma" class="kutu gizli">
          <strong>Ders programıyla çakışma var</strong>
          <ul id="cakisma-liste"></ul>
          <p class="alt">Yine de oluşturursanız etüt açılır; çakışan öğrencilerin derse mi etüte mi gideceğini velileri ve siz değerlendirin.</p>
          <button class="ikincil" type="button" id="yine-de">Yine de oluştur</button>
        </div>

        <p id="secim-ozet" class="alt"></p>
        <button class="birincil" type="submit">Etüt oluştur ve velilere gönder</button>
      </form>
    </section>

    <section id="liste-bolum" class="bolum-kutu">
      <h2 class="baslik2" id="liste-baslik">Etütler</h2>
      <div id="liste"></div>
    </section>
  </main>
  <script src="/grafik.js"></script>
  <script src="/pasta.js"></script>
  <script src="/etut.js"></script>
  <script src="/tablo.js"></script>
  <script src="/bant.js"></script>
</body>
</html>
