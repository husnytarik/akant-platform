<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akant Koleji - Derslerim</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/renk.js"></script>
</head>
<body>
  <header class="bant alt-bant">
    <a href="/panel" class="bant-geri" aria-label="Panele dön">&larr;</a>
    <h1>Derslerim</h1>
  </header>
  <main class="kart panel genis">
    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>

    <div class="sekmeler" id="gorunum">
      <button type="button" data-gorunum="gun" aria-pressed="true">Günlük</button>
      <button type="button" data-gorunum="hafta" aria-pressed="false">Haftalık</button>
      <button type="button" data-gorunum="siniflar" aria-pressed="false">Sınıflarım</button>
    </div>

    <div class="gun-seridi" id="gun-seridi">
      <button type="button" id="geri" aria-label="Önceki gün">&larr;</button>
      <div class="gun-baslik">
        <strong id="gun-adi"></strong>
        <button type="button" id="bugun" class="ikincil ikon-dugme" aria-label="Bugün" title="Bugün"><svg class="ik-gun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg><svg class="ik-hafta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M7.5 14h9M7.5 17.5h9"/></svg></button>
      </div>
      <button type="button" id="ileri" aria-label="Sonraki gün">&rarr;</button>
    </div>

    <div id="zaman"></div>
    <div id="hafta" class="gizli"></div>

    <section id="panel" class="ders-panel">
      <div class="ders-panel-ust">
        <div>
          <h2 id="p-baslik">Ders detayı</h2>
          <p id="p-alt" class="alt">Yukarıdan bir ders seçin.</p>
        </div>
        <button type="button" id="p-kapat" class="ikincil gizli">Kapat</button>
      </div>
      <div class="sekmeler" id="sekmeler">
        <button type="button" data-sekme="bitir" aria-pressed="false" class="gizli">Dersi bitir</button>
        <button type="button" data-sekme="ogrenciler" aria-pressed="true" disabled>Öğrenciler</button>
        <button type="button" data-sekme="konular" aria-pressed="false" disabled>Konular</button>
        <button type="button" data-sekme="odevler" aria-pressed="false" disabled>Ödevler</button>
      </div>
      <div id="icerik"><p class="bos-not">Bir ders seçtiğinizde öğrenci listesi, işlenen konular ve ödevler burada görünür.</p></div>
    </section>

    <section id="siniflar" class="gizli">
      <p class="alt">Ders verdiğiniz sınıflar (her kart bir sınıf + ders). Tarihten bağımsız olarak öğrenci listesi, konu ve ödevler için birine dokunun.</p>
      <div id="atamalar" class="modul-grid"></div>
    </section>
  </main>
  <script src="/grafik.js"></script>
  <script src="/pasta.js"></script>
  <script src="/ders-stil.js"></script>
  <script src="/kazanim-sec.js"></script>
  <script src="/bitir.js"></script>
  <script src="/derslerim.js"></script>
  <script src="/bant.js"></script>
</body>
</html>
