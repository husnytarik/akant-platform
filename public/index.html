<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neademy - Giriş</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="giris-sayfa">
  <header class="bant buyuk" id="bant">
    <div class="bant-marka"><strong>neademy</strong><span>Okul yönetim platformu</span></div>
    <div class="bant-avatar" aria-hidden="true"><span class="marka-isaret">n</span></div>
  </header>
  <main class="kart giris-kart">
    <form id="adim1">
      <label for="kimlik">T.C. kimlik no veya pasaport no</label>
      <input id="kimlik" autocomplete="username" inputmode="text" required maxlength="20">
      <label for="telefon">Telefon numarası</label>
      <input id="telefon" type="tel" autocomplete="tel" placeholder="5XX XXX XX XX" required maxlength="20">
      <button class="birincil" type="submit">Giriş yap</button>
    </form>

    <form id="adim2" class="gizli">
      <label for="kod">Telefonunuza gelen 6 haneli kod</label>
      <input id="kod" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required>
      <button class="birincil" type="submit">Doğrula</button>
      <button class="ikincil" type="button" id="geri">Bilgileri değiştir</button>
      <div id="dev" class="dev gizli"></div>
    </form>

    <section id="adim3" class="gizli">
      <h2 class="profil-baslik">Hangi profille devam edelim?</h2>
      <div id="profiller" class="profil-liste"></div>
    </section>

    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>
    <div id="demo" class="demo-link gizli">
      <span>Test girişi:</span>
      <button type="button" data-rol="yonetim">Yönetim</button>
      <button type="button" data-rol="rehber">Rehber</button>
      <button type="button" data-rol="teknik">Teknik</button>
      <button type="button" data-rol="zumre">Zümre</button>
      <button type="button" data-rol="ogretmen">Öğretmen</button>
      <button type="button" data-rol="ogrenci">Öğrenci</button>
      <button type="button" data-rol="veli">Veli</button>
      <button type="button" data-rol="coklu">Çok profilli</button>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
