<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akant Koleji - Giriş</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="giris-sayfa">
  <header class="bant buyuk" id="bant">
    <div class="bant-marka"><strong>Akant Koleji</strong><span>Okul yönetim platformu</span></div>
    <div class="bant-avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="52%" height="52%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c.9-4 4-5.6 7.5-5.6s6.6 1.6 7.5 5.6"/></svg>
    </div>
  </header>
  <main class="kart giris-kart">
    <div class="sekmeler" role="group" aria-label="Giriş türü">
      <button type="button" data-rol="yonetim" aria-pressed="true">Yönetim</button>
      <button type="button" data-rol="ogretmen" aria-pressed="false">Öğretmen</button>
      <button type="button" data-rol="ogrenci" aria-pressed="false">Öğrenci</button>
      <button type="button" data-rol="veli" aria-pressed="false">Veli</button>
    </div>

    <form id="adim1">
      <label for="kimlik">T.C. kimlik no veya pasaport no</label>
      <input id="kimlik" autocomplete="username" inputmode="text" required maxlength="20">
      <label for="telefon">Telefon numarası</label>
      <input id="telefon" type="tel" autocomplete="tel" placeholder="5XX XXX XX XX" required maxlength="20">
      <button class="birincil" type="submit">Doğrulama kodu gönder</button>
    </form>

    <form id="adim2" class="gizli">
      <label for="kod">Telefonunuza gelen 6 haneli kod</label>
      <input id="kod" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required>
      <button class="birincil" type="submit">Giriş yap</button>
      <button class="ikincil" type="button" id="geri">Bilgileri değiştir</button>
      <div id="dev" class="dev gizli"></div>
    </form>

    <p id="mesaj" class="mesaj" role="status" aria-live="polite"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
