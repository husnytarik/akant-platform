<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neademy - Panel</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/anim.js"></script>
</head>
<body>
  <header class="bant profil" id="bant">
    <div class="bant-marka"><strong>neademy</strong><span>Okul yönetim platformu</span></div>
    <a class="bant-avatar" id="avatar" href="/profil" aria-label="Profilim"><span id="bas-harf"></span></a>
    <a class="bant-kimlik" href="/profil">
      <h1 id="ad">&nbsp;</h1>
      <p id="unvan"></p>
    </a>
    <div class="bant-aksiyon">
      <a class="bant-cikis gizli" id="profil-degis" href="/?profil=1">Profil değiştir</a>
      <button class="bant-cikis" id="cikis" type="button">Çıkış</button>
    </div>
  </header>
  <main class="kart panel">
    <span id="rol" class="gizli"></span><span id="sube" class="gizli"></span>
    <section id="bugun-dersler" class="gizli">
      <div id="bugun-liste"></div>
      <div id="bekleyenler" class="bk gizli"></div>
    </section>
    <div class="kare-grid" id="moduller"></div>
  </main>
  <script src="/ders-stil.js"></script>
  <script src="/panel.js"></script>
</body>
</html>
